<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhao Liu — Automobiles</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           TOP NAVIGATION
        ========================= */

        .top {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #111;

            color: #111;
            text-decoration: none;

            font-size: 11px;
            font-weight: 500;

            letter-spacing: 1px;
        }

        .back {
            color: #111;
            text-decoration: none;

            font-size: 11px;

            letter-spacing: 2px;

            transition: opacity 0.3s ease;
        }

        .back:hover {
            opacity: 0.5;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .title {
            padding: 100px 5% 100px;
        }

        .title h1 {
            margin: 0;

            font-size: 18px;
            font-weight: 600;

            letter-spacing: 3px;
        }


        /* =========================
           PHOTO GALLERY
        ========================= */

        .gallery {

            width: 90%;

            margin: 0 auto 160px;

            column-count: 3;

            column-gap: 5%;
        }


        .photo {

            display: inline-block;

            width: 100%;

            margin: 0 0 100px;

            break-inside: avoid;

            cursor: pointer;

            overflow: hidden;
        }


        .photo img {

            display: block;

            width: 100%;

            height: auto;

            transition: opacity 0.3s ease;
        }


        /* Hover effect */

        .photo:hover img {
            opacity: 0.65;
        }


        /* =========================
           FULLSCREEN IMAGE VIEWER
        ========================= */

        .viewer {

            position: fixed;

            inset: 0;

            background: #fff;

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 1000;

            cursor: pointer;
        }


        .viewer.active {
            display: flex;
        }


        .viewer-content {

            max-width: 82vw;

            max-height: 90vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            cursor: pointer;
        }


        .viewer img {

            display: block;

            max-width: 82vw;

            max-height: 75vh;

            width: auto;

            height: auto;

            object-fit: contain;
        }


        /* =========================
           PHOTO INFORMATION
        ========================= */

        .photo-info {

            margin-top: 25px;

            text-align: center;

            font-size: 11px;

            font-weight: 300;

            letter-spacing: 1.5px;

            color: #555;
        }


        .photo-info span {
            margin: 0 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .top {
                padding: 25px 5%;
            }


            .title {
                padding: 70px 5% 70px;
            }


            .title h1 {
                font-size: 16px;
            }


            .gallery {

                width: 90%;

                column-count: 2;

                column-gap: 5%;

                margin-bottom: 100px;
            }


            .photo {

                margin-bottom: 60px;
            }


            .viewer img {

                max-width: 90vw;

                max-height: 70vh;
            }


            .photo-info {

                margin-top: 18px;

                font-size: 10px;
            }


            .photo-info span {
                margin: 0 6px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TOP
    ========================= -->

    <header class="top">

        <a href="index.html" class="logo">
            LM
        </a>

        <a href="index.html" class="back">
            BACK
        </a>

    </header>



    <!-- =========================
         TITLE
    ========================= -->

    <section class="title">

        <h1>
            AUTOMOBILES
        </h1>

    </section>



    <!-- =========================
         PHOTO GALLERY
    ========================= -->

    <main class="gallery">


        <!-- PHOTO 1 -->

        <div
            class="photo"
            data-date="2016.5.3"
            data-location="Beijing"
        >

            <img
                src="./photo1.jpg"
                alt="Automobiles"
            >

        </div>



        <!-- PHOTO 7 -->

        <div
            class="photo"
            data-date="2016.5.3"
            data-location="Beijing"
        >

            <img
                src="./photo7.jpg"
                alt="Automobiles"
            >

        </div>



        <!-- PHOTO 8 -->

        <div
            class="photo"
            data-date="2016.5.3"
            data-location="Beijing"
        >

            <img
                src="./photo8.jpg"
                alt="Automobiles"
            >

        </div>



        <!-- PHOTO 9 -->

        <div
            class="photo"
            data-date="2016.5.3"
            data-location="Beijing"
        >

            <img
                src="./photo9.jpg"
                alt="Automobiles"
            >

        </div>



        <!-- PHOTO 10 -->

        <div
            class="photo"
            data-date="2016.5.3"
            data-location="Beijing"
        >

            <img
                src="./photo10.jpg"
                alt="Automobiles"
            >

        </div>


    </main>



    <!-- =========================
         IMAGE VIEWER
    ========================= -->

    <div class="viewer">

        <div class="viewer-content">

            <img
                src=""
                alt="Automobile photograph"
            >

            <div class="photo-info">

                <span class="date"></span>

                <span>—</span>

                <span class="location"></span>

            </div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* =========================
           LOAD PHOTO 11 - PHOTO 100
        ========================= */

        const gallery = document.querySelector(".gallery");


        for (let i = 11; i <= 100; i++) {

            const photo = document.createElement("div");

            photo.className = "photo";

            photo.dataset.date = "2016.5.3";

            photo.dataset.location = "Beijing";


            photo.innerHTML = `

                <img
                    src="./photo${i}.jpg"
                    alt="Automobiles"
                    loading="lazy"
                >

            `;


            gallery.appendChild(photo);

        }



        /* =========================
           VIEWER ELEMENTS
        ========================= */

        const viewer = document.querySelector(".viewer");

        const viewerContent =
            document.querySelector(".viewer-content");

        const viewerImage =
            document.querySelector(".viewer img");

        const dateText =
            document.querySelector(".date");

        const locationText =
            document.querySelector(".location");



        /* =========================
           OPEN PHOTO
        ========================= */

        function openViewer(photo) {

            const image =
                photo.querySelector("img");


            viewerImage.src = image.src;

            viewerImage.alt = image.alt;


            dateText.textContent =
                photo.dataset.date;


            locationText.textContent =
                photo.dataset.location;


            viewer.classList.add("active");


            document.body.style.overflow = "hidden";

        }



        /* =========================
           ALL PHOTOS CLICK EVENT
        ========================= */

        function setupPhotoEvents() {

            const photos =
                document.querySelectorAll(".photo");


            photos.forEach(photo => {

                photo.addEventListener("click", function () {

                    openViewer(photo);

                });

            });

        }


        setupPhotoEvents();



        /* =========================
           CLOSE VIEWER
        ========================= */

        viewer.addEventListener("click", function () {

            viewer.classList.remove("active");

            document.body.style.overflow = "";

        });



        /* =========================
           PREVENT IMAGE CLICK FROM
           DOING ANYTHING EXTRA
        ========================= */

        viewerImage.addEventListener("click", function (event) {

            event.stopPropagation();

            viewer.classList.remove("active");

            document.body.style.overflow = "";

        });



        /* =========================
           ESC KEY
        ========================= */

        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {

                viewer.classList.remove("active");

                document.body.style.overflow = "";

            }

        });


    </script>


</body>

</html>
