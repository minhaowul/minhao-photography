<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhao Liu — Automobiles</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            background: #fff;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           TOP NAVIGATION
        ========================= */

        .top {
            padding: 30px 5%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #111;

            color: #111;
            text-decoration: none;

            font-size: 11px;
            font-weight: 500;

            letter-spacing: 1px;
        }


        .back {
            color: #111;
            text-decoration: none;

            font-size: 11px;

            letter-spacing: 2px;

            transition: opacity 0.25s ease;
        }


        .back:hover {
            opacity: 0.5;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .title {
            padding: 100px 5% 100px;
        }


        .title h1 {
            margin: 0;

            font-size: 18px;
            font-weight: 600;

            letter-spacing: 3px;
        }


        /* =========================
           PHOTO GALLERY
        ========================= */

        .gallery {

            width: 90%;

            margin: 0 auto 160px;

            column-count: 3;

            column-gap: 5%;
        }


        .photo {

            display: inline-block;

            width: 100%;

            margin: 0 0 100px;

            break-inside: avoid;

            cursor: pointer;

            overflow: hidden;
        }


        .photo img {

            display: block;

            width: 100%;
            height: auto;

            transition:
                opacity 0.3s ease;
        }


        .photo:hover img {
            opacity: 0.65;
        }


        /* =========================
           VIEWER
        ========================= */

        .viewer {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #fff;

            visibility: hidden;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.4s ease,
                visibility 0s linear 0.4s;
        }


        .viewer.active {

            visibility: visible;

            opacity: 1;

            pointer-events: auto;

            transition:
                opacity 0.4s ease;
        }


        /* =========================
           VIEWER CONTENT
        ========================= */

        .viewer-content {

            max-width: 82vw;
            max-height: 90vh;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            opacity: 0;

            transform:
                translate3d(0, 35px, 0)
                scale(0.90);

            transition:
                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.4s ease;

            will-change: transform, opacity;
        }


        .viewer.active .viewer-content {

            opacity: 1;

            transform:
                translate3d(0, 0, 0)
                scale(1);
        }


        /* =========================
           LARGE IMAGE
        ========================= */

        .viewer img {

            display: block;

            max-width: 82vw;

            max-height: 75vh;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;

            -webkit-user-drag: none;
        }


        /* =========================
           PHOTO INFORMATION
        ========================= */

        .photo-info {

            margin-top: 25px;

            text-align: center;

            font-size: 11px;

            font-weight: 300;

            letter-spacing: 1.5px;

            color: #555;

            min-height: 14px;
        }


        .photo-info span {
            margin: 0 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .top {
                padding: 25px 5%;
            }


            .title {
                padding: 70px 5% 70px;
            }


            .title h1 {
                font-size: 16px;
            }


            .gallery {

                width: 90%;

                column-count: 2;

                column-gap: 5%;

                margin-bottom: 100px;
            }


            .photo {
                margin-bottom: 60px;
            }


            .viewer img {

                max-width: 90vw;

                max-height: 70vh;
            }


            .viewer-content {

                max-width: 90vw;
            }


            .photo-info {

                margin-top: 18px;

                font-size: 10px;
            }


            .photo-info span {
                margin: 0 6px;
            }

        }


        /* =========================
           REDUCE MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            .viewer,
            .viewer-content,
            .photo img {

                transition: none !important;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TOP
    ========================= -->

    <header class="top">

        <a href="index.html" class="logo">
            LM
        </a>


        <a href="index.html" class="back">
            BACK
        </a>

    </header>



    <!-- =========================
         TITLE
    ========================= -->

    <section class="title">

        <h1>
            AUTOMOBILES
        </h1>

    </section>



    <!-- =========================
         PHOTO GALLERY
    ========================= -->

    <main class="gallery">

    </main>



    <!-- =========================
         IMAGE VIEWER
    ========================= -->

    <div class="viewer">

        <div class="viewer-content">

            <img
                src=""
                alt="Automobile photograph"
            >


            <div class="photo-info">

                <span class="date"></span>

                <span class="separator">—</span>

                <span class="location"></span>

            </div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* =========================
           PHOTO INFORMATION
        ========================= */

        const photoInfo = {};


        /* PHOTO 1-3 */

        for (let i = 1; i <= 3; i++) {

            photoInfo[i] = {
                date: "2026.09.03",
                location: "Beijing"
            };

        }


        /* PHOTO 4-5 */

        for (let i = 4; i <= 5; i++) {

            photoInfo[i] = {
                date: "",
                location: ""
            };

        }


        /* PHOTO 6-56 */

        for (let i = 6; i <= 56; i++) {

            photoInfo[i] = {
                date: "2026.05.03",
                location: "Beijing"
            };

        }


        /* PHOTO 57-65 */

        for (let i = 57; i <= 65; i++) {

            photoInfo[i] = {
                date: "2026.03.14",
                location: "Beijing"
            };

        }


        /* PHOTO 66 */

        photoInfo[66] = {
            date: "2025.12.23",
            location: "Beijing"
        };


        /* PHOTO 67-72 */

        for (let i = 67; i <= 72; i++) {

            photoInfo[i] = {
                date: "2026.01.07",
                location: "Beijing"
            };

        }


        /* PHOTO 73-79 */

        for (let i = 73; i <= 79; i++) {

            photoInfo[i] = {
                date: "2026.01.22",
                location: "Macau"
            };

        }


        /* PHOTO 80 */

        photoInfo[80] = {
            date: "2026.01.26",
            location: "Hong Kong"
        };


        /* PHOTO 81 */

        photoInfo[81] = {
            date: "2025.10.30",
            location: "Beijing"
        };


        /* PHOTO 82-83 */

        for (let i = 82; i <= 83; i++) {

            photoInfo[i] = {
                date: "2026.01.22",
                location: "Macau"
            };

        }


        /* PHOTO 84 */

        photoInfo[84] = {
            date: "2026.03.14",
            location: "Beijing"
        };


        /* PHOTO 85-100 */

        for (let i = 85; i <= 100; i++) {

            photoInfo[i] = {
                date: "2026.09.03",
                location: "Beijing"
            };

        }



        /* =========================
           CREATE GALLERY
        ========================= */

        const gallery =
            document.querySelector(".gallery");


        for (let i = 1; i <= 100; i++) {

            const photo =
                document.createElement("div");


            photo.className = "photo";


            photo.dataset.date =
                photoInfo[i]?.date || "";


            photo.dataset.location =
                photoInfo[i]?.location || "";


            photo.innerHTML = `

                <img
                    src="./webp/photo${i}.webp"
                    alt="Automobiles"
                    loading="lazy"
                >

            `;


            gallery.appendChild(photo);

        }



        /* =========================
           VIEWER ELEMENTS
        ========================= */

        const viewer =
            document.querySelector(".viewer");


        const viewerContent =
            document.querySelector(".viewer-content");


        const viewerImage =
            document.querySelector(".viewer img");


        const dateText =
            document.querySelector(".date");


        const locationText =
            document.querySelector(".location");


        const separator =
            document.querySelector(".separator");



        /* =========================
           OPEN VIEWER
        ========================= */

        function openViewer(photo) {

            const image =
                photo.querySelector("img");


           const imageURL =
    image.src.replace("/webp/", "/large/");

            /*
             * Preload the full-size image
             * before starting the animation.
             */

            const preload =
                new Image();


            preload.src = imageURL;


            /*
             * Show information immediately.
             */

            dateText.textContent =
                photo.dataset.date;


            locationText.textContent =
                photo.dataset.location;


            if (
                !photo.dataset.date &&
                !photo.dataset.location
            ) {

                separator.style.display =
                    "none";

            } else {

                separator.style.display =
                    "inline";

            }


            /*
             * If the image is already cached,
             * open immediately.
             */

            if (preload.complete) {

                showViewer(imageURL);

            } else {

                /*
                 * Otherwise wait until the image
                 * has finished loading.
                 */

                preload.onload = function () {

                    showViewer(imageURL);

                };

            }

        }



        /* =========================
           SHOW VIEWER
        ========================= */

        function showViewer(imageURL) {

            viewerImage.src =
                imageURL;


            viewer.classList.add("active");


            document.body.style.overflow =
                "hidden";

        }



        /* =========================
           CLICK ALL PHOTOS
        ========================= */

        const photos =
            document.querySelectorAll(".photo");


        photos.forEach(photo => {

            photo.addEventListener(
                "click",
                function () {

                    openViewer(photo);

                }
            );

        });



        /* =========================
           CLOSE VIEWER
        ========================= */

        function closeViewer() {

            viewer.classList.remove("active");

            document.body.style.overflow =
                "";

        }



        viewer.addEventListener(
            "click",
            function () {

                closeViewer();

            }
        );



        /* =========================
           ESC KEY
        ========================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    viewer.classList.contains("active")
                ) {

                    closeViewer();

                }

            }
        );


    </script>


</body>

</html>
